<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aditbhavesh (Adit Bhavesh) - GitHub Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h3 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #58a6ff;
      margin: 24px 0 12px 0;
      font-weight: 500;
      font-size: 1.15rem;
    }
    h3 code {
      background: #161b22;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      border-spacing: 0;
    }
    td {
      padding: 6px;
      vertical-align: top;
    }
    img {
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="profile-container">

    <h3><code>aditbhavesh@github ~ $ whoami</code></h3>
    <table>
      <tr>
        <td valign="top"><img src="./ascii-portrait.svg" width="420" alt="ASCII Portrait" /></td>
        <td valign="top"><img src="./info-card.svg" width="420" alt="Neofetch Card" /></td>
      </tr>
    </table>

  </div>
</body>
</html>
